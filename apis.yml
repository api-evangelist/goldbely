aid: goldbely
name: Goldbelly
description: >-
  Goldbelly is a curated online marketplace for gourmet food and mail-order
  culinary gifts, shipping iconic meals, desserts, regional specialties, and
  artisanal products from renowned restaurants, bakeries, and celebrity chefs
  across the United States directly to consumers' doors. The platform partners
  with thousands of local and legendary food makers to make hard-to-get regional
  foods available nationwide, and operates a merchant program ("Sell on
  Goldbelly") plus corporate and subscription gifting. Goldbelly is a consumer
  e-commerce brand with no publicly documented developer API; this profile
  captures its public web, merchant, and corporate identity. It was surfaced as
  a portfolio company of a16z and added to the API Evangelist network.
